# Builds the game for iOS and the Apple TV on its own (.github/actions/engine:
# SDL3 for each, then ninja ios or tvos), for the port's changes: the game as
# a static library, and a link of it with SDL3 and the platform's frameworks
# that fails on anything missing. The app's workflow (ios.yml) runs the same
# build to link the game in.
name: Engine

on:
  push:
    branches: [main]
    paths: ["port/**", "patches/**", "chupathingyce", ".github/actions/engine/**", ".github/workflows/engine.yml"]
  workflow_dispatch:

env:
  # chupathingyce's pin (tools/android_build.py: SDL_TAG, SDL_COMMIT)
  SDL_TAG: release-3.4.16
  SDL_COMMIT: fa2c02bb6e21974a89ea9824bc53c9932abe5f9c
  IOS_MINIMUM: "16.4"

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        platform: [ios, tvos]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Use the newest Xcode on the runner
        run: |
          xcode=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$xcode"
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          xcrun --sdk appletvos --show-sdk-version

      - uses: ./.github/actions/engine
        with:
          platform: ${{ matrix.platform }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: engine-${{ matrix.platform }}
          path: |
            ninja.log
            chupathingyce/build/${{ matrix.platform }}/libhalo.a
            chupathingyce/build/${{ matrix.platform }}/libhalo_check.dylib
          if-no-files-found: ignore
          retention-days: 14
