# Builds the app for iPhone and iPad, unsigned, on a macOS runner: the .ipa
# is the run's artifact, for SideStore or AltStore to sign with a free Apple
# ID and install. No Mac or paid account needed.
#
# The game is built first (.github/actions/engine) and linked into the
# native app (app/project.yml, which XcodeGen makes the Xcode project of).
name: iOS

on:
  push:
    branches: [main]
    paths: ["app/**", "port/**", "patches/**", "chupathingyce", ".github/actions/engine/**", ".github/workflows/ios.yml"]
  workflow_dispatch:
    inputs:
      configuration:
        description: "Release, or Debug (the launcher's Swift unoptimised, for the debugger)"
        type: choice
        options: [Release, Debug]
        default: Release

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 120
    env:
      CONFIGURATION: ${{ inputs.configuration || 'Release' }}
      # chupathingyce's pin (tools/android_build.py: SDL_TAG, SDL_COMMIT)
      SDL_TAG: release-3.4.16
      SDL_COMMIT: fa2c02bb6e21974a89ea9824bc53c9932abe5f9c
      IOS_MINIMUM: "16.4"
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Use the newest Xcode on the runner
        run: |
          xcode=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$xcode"
          xcodebuild -version

      - name: The game
        uses: ./.github/actions/engine

      - name: The game, into the app
        run: |
          mkdir -p lib
          cp ../chupathingyce/build/ios/libhalo.a ../build/sdl3-ios/lib/libSDL3.a lib/
          ls -lh lib

      # internet play's MQTT brokers, and the certificate authorities HTTPS
      # is checked against (curl's copy of Mozilla's, checked against the
      # digest curl publishes beside it): port/ios/src/ios_main.c
      - name: Internet play's files, into the bundle
        run: |
          cp ../chupathingyce/port/assets/network/brokers.txt Resources/
          curl -fsSL https://curl.se/ca/cacert.pem -o Resources/cacert.pem
          curl -fsSL https://curl.se/ca/cacert.pem.sha256 | awk '{ print $1 "  Resources/cacert.pem" }' | shasum -a 256 -c -

      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build, unsigned
        run: |
          # (the whole log is the artifact below when this fails; here, its errors)
          set +e
          xcodebuild \
            -project ChupathingyCE.xcodeproj -scheme ChupathingyCE \
            -configuration "$CONFIGURATION" \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build > xcodebuild.log 2>&1
          status=$?
          grep -E 'error:|\*\* BUILD' xcodebuild.log | tail -60
          grep -E -A30 'Undefined symbols|duplicate symbol' xcodebuild.log | head -120
          exit $status

      - name: Package the .ipa
        run: |
          mkdir -p Payload
          cp -R "build/Build/Products/$CONFIGURATION-iphoneos/ChupathingyCE.app" Payload/
          zip -qry "ChupathingyCE-$CONFIGURATION.ipa" Payload
          ls -lh "ChupathingyCE-$CONFIGURATION.ipa"

      - uses: actions/upload-artifact@v4
        with:
          name: ChupathingyCE-${{ env.CONFIGURATION }}-ipa
          path: app/ChupathingyCE-${{ env.CONFIGURATION }}.ipa
          retention-days: 14

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-logs
          path: |
            app/xcodebuild.log
            ninja.log
          if-no-files-found: ignore
