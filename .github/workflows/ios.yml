# Builds the apps, unsigned, on a macOS runner: ChupathingyCE for iPhone and
# iPad (and the Vision Pro, which runs it as an iPad app), and for the Apple
# TV. Each .ipa is the run's artifact, for SideStore, AltStore or Sideloadly
# to sign with a free Apple ID and install. No Mac or paid account needed.
#
# The game is built first for each (.github/actions/engine) and linked into
# the native app (app/project.yml, which XcodeGen makes the Xcode project of).
#
# A pushed tag v<version> (v0.3.0) is a release (release.yml, which runs
# this, then publishes both .ipa files): the apps take its version.
name: iOS

on:
  workflow_call:
  push:
    branches: [main]
    paths: ["app/**", "port/**", "patches/**", "chupathingyce", ".github/actions/engine/**", ".github/workflows/ios.yml"]
  workflow_dispatch:
    inputs:
      configuration:
        description: "Release, or Debug (the launcher's Swift unoptimised, for the debugger)"
        type: choice
        options: [Release, Debug]
        default: Release

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ios
            scheme: ChupathingyCE
            sdk: iphoneos
            destination: generic/platform=iOS
            lib: lib
          - platform: tvos
            scheme: ChupathingyCE-tvOS
            sdk: appletvos
            destination: generic/platform=tvOS
            lib: lib-tvos
    env:
      CONFIGURATION: ${{ inputs.configuration || 'Release' }}
      # a release's tag (v0.3.0), else empty
      VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
      # chupathingyce's pin (tools/android_build.py: SDL_TAG, SDL_COMMIT)
      SDL_TAG: release-3.4.16
      SDL_COMMIT: fa2c02bb6e21974a89ea9824bc53c9932abe5f9c
      IOS_MINIMUM: "16.4"
      PLATFORM: ${{ matrix.platform }}
      SCHEME: ${{ matrix.scheme }}
      SDK: ${{ matrix.sdk }}
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Use the newest Xcode on the runner
        run: |
          xcode=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$xcode"
          xcodebuild -version
          xcrun --sdk "$SDK" --show-sdk-version

      - name: The game
        uses: ./.github/actions/engine
        with:
          platform: ${{ matrix.platform }}

      - name: The game, into the app
        run: |
          mkdir -p ${{ matrix.lib }}
          cp "../chupathingyce/build/$PLATFORM/libhalo.a" "../build/sdl3-$PLATFORM/lib/libSDL3.a" ${{ matrix.lib }}/
          ls -lh ${{ matrix.lib }}

      # internet play's MQTT brokers, and the certificate authorities HTTPS
      # is checked against (curl's copy of Mozilla's, checked against the
      # digest curl publishes beside it): port/ios/src/ios_main.c
      - name: Internet play's files, into the bundle
        run: |
          cp ../chupathingyce/port/assets/network/brokers.txt Resources/
          curl -fsSL https://curl.se/ca/cacert.pem -o Resources/cacert.pem
          curl -fsSL https://curl.se/ca/cacert.pem.sha256 | awk '{ print $1 "  Resources/cacert.pem" }' | shasum -a 256 -c -

      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      # iPhone Duo's fold for the touch controls (app/Sources/iOS/Fold.swift)
      # is iOS 27.1's: on with that SDK or newer, and left out before it
      - name: What the SDK has
        if: matrix.platform == 'ios'
        run: |
          version=$(xcrun --sdk iphoneos --show-sdk-version)
          if [ "$(printf '%s\n27.1\n' "$version" | sort -V | head -1)" = "27.1" ]; then
            echo "iOS $version SDK: iPhone Duo's fold on"
            echo "SWIFT_CONDITIONS=IOS_27_1_SDK" >> "$GITHUB_ENV"
          else
            echo "iOS $version SDK: iPhone Duo's fold left out until 27.1"
          fi

      - name: Build, unsigned
        run: |
          # (the whole log is the artifact below when this fails; here, its errors)
          set +e
          xcodebuild \
            -project ChupathingyCE.xcodeproj -scheme "$SCHEME" \
            -configuration "$CONFIGURATION" \
            -sdk "$SDK" -destination '${{ matrix.destination }}' \
            -derivedDataPath build \
            ${VERSION:+MARKETING_VERSION=${VERSION#v} CURRENT_PROJECT_VERSION=$GITHUB_RUN_NUMBER} \
            ${SWIFT_CONDITIONS:+"SWIFT_ACTIVE_COMPILATION_CONDITIONS=\$(inherited) $SWIFT_CONDITIONS"} \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build > xcodebuild.log 2>&1
          status=$?
          grep -E 'error:|\*\* BUILD' xcodebuild.log | tail -60
          grep -E -A30 'Undefined symbols|duplicate symbol' xcodebuild.log | head -120
          exit $status

      - name: Package the .ipa
        run: |
          mkdir -p Payload
          cp -R "build/Build/Products/$CONFIGURATION-$SDK/ChupathingyCE.app" Payload/
          zip -qry "ChupathingyCE-$PLATFORM-$CONFIGURATION.ipa" Payload
          ls -lh "ChupathingyCE-$PLATFORM-$CONFIGURATION.ipa"

      - uses: actions/upload-artifact@v4
        with:
          name: ChupathingyCE-${{ matrix.platform }}-${{ env.CONFIGURATION }}-ipa
          path: app/ChupathingyCE-${{ matrix.platform }}-${{ env.CONFIGURATION }}.ipa
          retention-days: 14

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-logs-${{ matrix.platform }}
          path: |
            app/xcodebuild.log
            ninja.log
          if-no-files-found: ignore
