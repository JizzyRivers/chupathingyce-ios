# Builds the app for iPhone and iPad, unsigned, on a macOS runner: the .ipa
# is the run's artifact, for SideStore or AltStore to sign with a free Apple
# ID and install. No Mac or paid account needed.
#
# Debug is the development build: it loads the JavaScript from
# `npx expo start` on the computer, as Expo Go does, so only native changes
# need a new build. Release carries its JavaScript and runs on its own.
name: iOS

on:
  push:
    branches: [main]
    paths: ["app/**", ".github/workflows/ios.yml"]
  workflow_dispatch:
    inputs:
      configuration:
        description: "Debug (development build) or Release (standalone)"
        type: choice
        options: [Debug, Release]
        default: Debug

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      CONFIGURATION: ${{ inputs.configuration || 'Debug' }}
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - name: Use the newest Xcode on the runner
        run: |
          xcode=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$xcode"
          xcodebuild -version

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - run: npm ci

      - name: Tests and typecheck
        run: |
          npm test
          npx tsc --noEmit

      - name: Generate the iOS project
        run: npx expo prebuild --platform ios --clean --no-install

      - name: Install the pods
        working-directory: app/ios
        run: pod install

      - name: Build, unsigned
        working-directory: app/ios
        run: |
          workspace=$(ls -d *.xcworkspace | head -1)
          scheme=${workspace%.xcworkspace}
          echo "workspace $workspace, scheme $scheme"
          # (the whole log is the artifact below when this fails; here, its errors)
          set +e
          xcodebuild \
            -workspace "$workspace" -scheme "$scheme" \
            -configuration "$CONFIGURATION" \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build > xcodebuild.log 2>&1
          status=$?
          grep -E 'error:|\*\* BUILD' xcodebuild.log | tail -60
          exit $status

      - name: Package the .ipa
        working-directory: app/ios
        run: |
          app=$(ls -d build/Build/Products/"$CONFIGURATION"-iphoneos/*.app | head -1)
          mkdir -p Payload
          cp -R "$app" Payload/
          zip -qry "ChupathingyCE-$CONFIGURATION.ipa" Payload
          ls -lh "ChupathingyCE-$CONFIGURATION.ipa"

      - uses: actions/upload-artifact@v4
        with:
          name: ChupathingyCE-${{ env.CONFIGURATION }}-ipa
          path: app/ios/ChupathingyCE-${{ env.CONFIGURATION }}.ipa
          retention-days: 14

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: xcodebuild-log
          path: app/ios/xcodebuild.log
          if-no-files-found: ignore
