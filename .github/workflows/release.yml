# A pushed tag v<version> (v0.3.0) builds the apps at that version (ios.yml)
# and publishes them as a GitHub pre-release, with
# .github/release-notes.md: one .ipa for iPhone, iPad and the Vision Pro,
# one for the Apple TV. Its own workflow: ios.yml's paths filter keeps a
# tag's push from running it. (A tagged commit whose message says [skip ci]
# runs nothing, this included: tag one that does not.)
name: Release

on:
  push:
    tags: ["v*"]

jobs:
  apps:
    uses: ./.github/workflows/ios.yml

  publish:
    needs: apps
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: ChupathingyCE-*-Release-ipa
          merge-multiple: true

      - name: Publish the release
        run: |
          mv ChupathingyCE-ios-Release.ipa "ChupathingyCE-$VERSION-iOS.ipa"
          mv ChupathingyCE-tvos-Release.ipa "ChupathingyCE-$VERSION-tvOS.ipa"
          sha256sum ChupathingyCE-*.ipa > SHA256SUMS.txt
          gh release create "$VERSION" ChupathingyCE-*.ipa SHA256SUMS.txt \
            --title "$VERSION" \
            --notes-file .github/release-notes.md --prerelease
